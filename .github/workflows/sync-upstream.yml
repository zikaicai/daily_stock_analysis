name: Sync Upstream

permissions:
  contents: write

on:
  # 每12小时同步一次
  schedule:
    - cron: '0 */12 * * *'

  # 手动触发
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Upstream Sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          # 你自己的 fork 分支
          target_sync_branch: main

          # GitHub Token（必须）
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}

          # 上游仓库
          upstream_sync_repo: ZhuLinsen/daily_stock_analysis

          # 上游分支
          upstream_sync_branch: main

          # 推荐配置
          target_branch_push_args: --force-with-lease
          git_config_pull_rebase: false

      - name: Show latest commit
        run: |
          echo ""
          echo "=========================================="
          echo "✅ Sync Completed"
          echo "=========================================="
          echo ""
          echo "📦 Latest Commit:"
          git log -1 --oneline
